services:
  app:
    image: linkedinsney:latest
    container_name: linkedinsney
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}
        NEXT_PUBLIC_SITE: ${NEXT_PUBLIC_SITE}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
        AUTHOR_NAME: ${AUTHOR_NAME}
        AUTHOR_EMAIL: ${AUTHOR_EMAIL}
        DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
    ports:
      - "4005:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN}
      OLLAMA_API_MODEL: ${OLLAMA_API_MODEL}
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}
      NEXT_PUBLIC_SITE: ${NEXT_PUBLIC_SITE}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL}
      AUTHOR_NAME: ${AUTHOR_NAME}
      AUTHOR_EMAIL: ${AUTHOR_EMAIL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RESEND_API_URL: ${RESEND_API_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      RESEND_TO_EMAIL: ${RESEND_TO_EMAIL}
    restart: unless-stopped