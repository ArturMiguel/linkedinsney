services:
  app:
    image: linkedinsney-web:latest
    container_name: linkedinsney-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}
    ports:
      - "4005:3000"
    environment:
      NODE_ENV: ${NODE_ENV}
      OLLAMA_API_URL: ${OLLAMA_API_URL}
      OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN}
      NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL}
    restart: unless-stopped