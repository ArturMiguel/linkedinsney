name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy-linkedinsney:
    runs-on: [self-hosted, linkedinsney-runner]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > .env << EOF
          NODE_ENV=production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          NEXT_PUBLIC_SITE=${{ vars.NEXT_PUBLIC_SITE }}
          AUTHOR_NAME=${{ vars.AUTHOR_NAME }}
          AUTHOR_EMAIL=${{ vars.AUTHOR_EMAIL }}
          NEXT_PUBLIC_SUPPORT_EMAIL=${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL }}
          NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
          OLLAMA_API_URL=${{ secrets.OLLAMA_API_URL }}
          OLLAMA_API_TOKEN=${{ secrets.OLLAMA_API_TOKEN }}
          OLLAMA_API_MODEL=${{ vars.OLLAMA_API_MODEL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_DIRECT_URL=${{ secrets.DATABASE_DIRECT_URL }}
          RESEND_API_URL=${{ vars.RESEND_API_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_TO_EMAIL=${{ secrets.RESEND_TO_EMAIL }}
          EOF

      - name: Build and deploy
        run: |
          docker compose build --no-cache
          docker compose down
          docker compose up -d
          docker image prune -f
